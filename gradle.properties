# R8 and lint need headroom on top of the Compose toolchain. Keep the heap
# modest and run tasks in a single worker so the build also fits on 8 GB
# machines that are running an IDE at the same time.
#
# Kotlin compiles in the Gradle daemon instead of a separate Kotlin daemon.
# On 8 GB machines Android Studio already holds ~3 GB, and the extra Kotlin
# JVM (~1 GB RSS) was enough to push the kernel OOM killer onto the build
# JVMs. One JVM with a slightly larger heap uses less memory overall, and the
# trade-off is only slower incremental compiles.
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.workers.max=2
# Reuse task outputs across builds (daemon restarts, branch switches, clean builds).
org.gradle.caching=true
org.gradle.vfs.watch=true
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
