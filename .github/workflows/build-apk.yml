name: Release APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Least privilege by default. The publish job opts into contents: write and is
# the only place where signing secrets are referenced.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Builds and tests. Deliberately has no access to signing secrets: a
  # collaborator with write access can edit this file, so nothing here is
  # trusted with the keystore.
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history and tags: the release notes need the previous tag for
          # the Full Changelog link and for contributor attribution.
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Generate debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android -keypass android \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Lint and unit tests
        run: ./gradlew --no-daemon lintDebug testDebugUnitTest

      - name: Show lint report on failure
        if: failure()
        run: cat app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt || true

      # No keystore.properties exists here, so AGP emits an unsigned APK.
      # Signing happens in the publish job, after manual approval.
      - name: Build unsigned release APK
        if: github.ref_type == 'tag'
        run: ./gradlew --no-daemon assembleRelease

      - name: Build debug APK
        if: github.ref_type != 'tag'
        run: ./gradlew --no-daemon assembleDebug

      # Build the release body from the in-app changelog so it never goes stale.
      - name: Collect release artifacts
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK="Seriee-${GITHUB_REF_NAME}-unsigned.apk"
          cp app/build/outputs/apk/release/app-release-unsigned.apk "$APK"

          VERSION=$(jq -r '.elements[0].versionName' app/build/outputs/apk/release/output-metadata.json)
          export VERSION

          # Previous release tag: used for the Full Changelog link and to credit
          # everyone who contributed since it. Empty on the first release.
          PREVIOUS_TAG=$(git tag --list 'v*' --sort=-creatordate | grep -vx "$GITHUB_REF_NAME" | head -n1 || true)
          export PREVIOUS_TAG
          CONTRIBUTORS=""
          if [ -n "$PREVIOUS_TAG" ]; then
            CONTRIBUTORS=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${PREVIOUS_TAG}...${GITHUB_REF_NAME}" \
              --jq '[.commits[]
                     | (if .author.login != null then "@" + .author.login else .commit.author.name end)
                     | select(endswith("[bot]") | not)]
                   | unique | join("|")')
          fi
          export CONTRIBUTORS

          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET

          version = os.environ["VERSION"]
          short_sha = os.environ["GITHUB_SHA"][:7]
          repository = os.environ["GITHUB_REPOSITORY"]
          ref_name = os.environ["GITHUB_REF_NAME"]
          previous_tag = os.environ.get("PREVIOUS_TAG", "")
          contributors = [c for c in os.environ.get("CONTRIBUTORS", "").split("|") if c]
          root = ET.parse("app/src/main/res/values/strings.xml").getroot()

          def read_string(node):
              return "".join(node.itertext()).replace("\\'", "'").strip()

          # changelog_current is the single source of truth for this release: the
          # What's New dialog and this script read the same list. Entries are
          # either @string/ references or literal text.
          current = root.find("string-array[@name='changelog_current']")
          if current is None:
              raise SystemExit(
                  "::error::strings.xml has no changelog_current string-array; "
                  "refusing to publish notes without a What's new section."
              )

          items = []
          for entry in current.findall("item"):
              reference = (entry.text or "").strip()
              if not reference.startswith("@string/"):
                  items.append(read_string(entry))
                  continue
              name = reference[len("@string/"):]
              node = root.find(f"string[@name='{name}']")
              if node is None:
                  raise SystemExit(f"::error::changelog_current references missing string {name}")
              items.append(read_string(node))

          if not items:
              raise SystemExit("::error::changelog_current is empty; refusing to publish empty release notes.")

          lines = [
              f"### Seriee {version}",
              "",
              f"Signed release built from commit `{short_sha}`.",
              "",
              "**What's new**",
              "",
          ]
          lines += [f"- {item}" for item in items]
          lines += [
              "",
              "### Verify the download",
              "",
              "```bash",
              "sha256sum -c SHA256SUMS.txt",
              "```",
              "",
              "The APK must be signed with the certificate in `signing-certificate.txt`.",
              "",
              "Full history: https://github.com/eggBrainX/Seriee/blob/main/CHANGELOG.md",
              "",
              "### Install",
              "",
              "Download the `.apk` asset below and open it on the device. Android may ask you to allow installs from your browser or file manager.",
              "",
          ]
          if contributors:
              lines += ["### Contributors", ""]
              lines += [f"- {contributor}" for contributor in contributors]
              lines += [""]
          if previous_tag:
              lines += [
                  f"**Full Changelog**: https://github.com/{repository}/compare/{previous_tag}...{ref_name}",
                  "",
              ]
          with open("release-notes.md", "w", encoding="utf-8") as fh:
              fh.write("\n".join(lines))
          PY

          echo "Prepared $APK"

      - name: Collect debug artifact (not published)
        if: github.ref_type != 'tag'
        run: |
          set -euo pipefail
          VERSION=$(jq -r '.elements[0].versionName' app/build/outputs/apk/debug/output-metadata.json)
          APK="Seriee-${VERSION}-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK"
          sha256sum "$APK" > SHA256SUMS-debug.txt
          echo "Prepared $APK"

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: seriee-apk
          if-no-files-found: error
          path: |
            Seriee-*.apk
            SHA256SUMS*.txt
            release-notes.md

  # Signs and publishes. Protected by the "release" environment, which must be
  # configured with required reviewers and a deployment tag rule for `v*`:
  # a branch push by a collaborator cannot reach these secrets even if they
  # rewrite this workflow.
  publish:
    name: Sign and publish
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: seriee-apk
          path: dist

      # apksigner is a Java tool; the runner's default JDK is not guaranteed.
      - name: Set up JDK 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'

      # Fail fast (after approval) if the environment secrets are missing,
      # instead of publishing an unsigned APK.
      - name: Check signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set on the release environment; cannot sign."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "All signing secrets are set."

      - name: Restore signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/seriee-release.keystore"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE"
          chmod 600 "$KEYSTORE"

      # apksigner reads the passwords from the environment, so they never
      # appear in the command line or in a process listing.
      - name: Sign and verify the APK
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK" ]; then
            echo "::error::Android SDK location is not set."
            exit 1
          fi
          BUILD_TOOLS=$(ls -d "$SDK"/build-tools/* | sort -V | tail -n 1)
          UNSIGNED="dist/Seriee-${GITHUB_REF_NAME}-unsigned.apk"
          APK="dist/Seriee-${GITHUB_REF_NAME}.apk"
          mv "$UNSIGNED" "$APK"

          # AGP already aligns its output; refuse to sign anything else.
          "$BUILD_TOOLS/zipalign" -c -v 4 "$APK" > /dev/null

          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/seriee-release.keystore" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KS_PASS \
            --key-pass env:KEY_PASS \
            "$APK"

          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK" > dist/signing-certificate.txt
          (cd dist && sha256sum "$(basename "$APK")" > SHA256SUMS.txt)
          echo "Signed and verified $APK"

      - name: Append signing certificate to release notes
        run: |
          set -euo pipefail
          {
            echo ""
            echo "### Signing certificate"
            echo ""
            echo '```'
            grep -E 'certificate (DN|SHA-256 digest):' dist/signing-certificate.txt || true
            echo '```'
          } >> dist/release-notes.md

      - name: Create or update the versioned release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd dist
          APK="Seriee-${GITHUB_REF_NAME}.apk"
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "Seriee $GITHUB_REF_NAME" --notes-file release-notes.md
            gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              "$APK" SHA256SUMS.txt signing-certificate.txt --clobber
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              "$APK" SHA256SUMS.txt signing-certificate.txt \
              --title "Seriee $GITHUB_REF_NAME" --notes-file release-notes.md
          fi
